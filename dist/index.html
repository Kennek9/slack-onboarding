<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="从飞书到 Slack：办公室宣讲版。会前准备、在哪说话、别漏消息、一起干活、现场演示，配真实截图和官方中文教程。">
  <meta name="theme-color" content="#faf9f6">
  <title>从飞书到 Slack · Glorify</title>
  <style>
    :root {
      --paper: #faf9f6;
      --ink: #2b2730;
      --muted: #746c78;
      --line: #e6e1e8;
      --purple: #49264f;
      --soft: #f0eaf3;
      --green: #eef3e2;
      --green-ink: #465c33;
      --focus: #e0322b;
      --scale: 1;
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--paper); color: var(--ink); font: 15px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; -webkit-font-smoothing: antialiased; }
    button { font: inherit; cursor: pointer; }
    button:disabled { cursor: default; opacity: .45; }
    a { color: inherit; }
    button:focus-visible, a:focus-visible { outline: 3px solid #a58caf; outline-offset: 3px; }
    svg { width: 15px; height: 15px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; vertical-align: -2px; }
    .icons { display: none; }
    .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

    .wrap { width: min(1760px, calc(100% - 64px)); margin: 0 auto; min-height: 100vh; display: flex; flex-direction: column; }
    .top { min-height: 60px; border-bottom: 1px solid var(--line); display: flex; align-items: center; justify-content: space-between; gap: 16px; }
    .brand { display: flex; align-items: baseline; gap: 14px; }
    .wordmark { font-family: Georgia, serif; font-size: 24px; font-weight: 700; letter-spacing: -1.4px; }
    .brand-title { font-size: 14px; color: var(--muted); }
    .top-actions { display: flex; gap: 4px; }
    .top-link { border: 0; background: none; color: var(--muted); font-size: 13px; min-height: 40px; padding: 0 10px; border-radius: 6px; }
    .top-link:hover { background: var(--soft); color: var(--purple); }

    .slide { flex: 1; padding: 22px 0 18px; display: flex; flex-direction: column; min-height: 0; }
    .kicker { display: flex; align-items: center; gap: 10px; font-size: 13px; color: var(--muted); }
    .kicker strong { color: var(--purple); font-weight: 600; }
    .kicker .tag { font-size: 11px; padding: 2px 8px; border-radius: 10px; background: var(--soft); color: var(--purple); }
    .slide h2 { font-size: clamp(24px, 2.4vw, 36px); line-height: 1.3; letter-spacing: -.03em; font-weight: 650; margin: 6px 0 20px; }
    .body { flex: 1; display: flex; gap: 44px; align-items: flex-start; }
    .body > .figure-col { flex: 0 1 auto; min-width: 0; max-width: calc(100% - 300px); }
    .body > .text-col { flex: 0 1 400px; min-width: 240px; padding-top: 4px; }
    .body.full { display: block; }

    .shot { position: relative; display: block; margin: 0; width: min(calc(var(--w) * var(--scale)), calc((100vh - 310px) * var(--r))); max-width: 100%; border-radius: 10px; overflow: hidden; box-shadow: 0 0 0 1px var(--line), 0 10px 28px #321b380d; background: white; }
    .shot img { display: block; width: 100%; height: auto; }
    .shot .box { position: absolute; border: 3px solid var(--focus); border-radius: 7px; pointer-events: none; }
    .shot-missing { display: grid; place-items: center; align-content: center; gap: 6px; width: min(calc(var(--w) * var(--scale)), calc((100vh - 310px) * 1.6)); max-width: 100%; aspect-ratio: 16 / 10; border: 2px dashed #cfc6d4; border-radius: 10px; color: var(--muted); text-align: center; padding: 24px; background: #fffdfb; }
    .shot-missing strong { font-size: 14px; color: var(--ink); }
    .shot-missing span { font-size: 13px; }

    .points { list-style: none; margin: 0; padding: 0; display: grid; gap: 14px; counter-reset: point; }
    .points li { counter-increment: point; display: grid; grid-template-columns: 26px 1fr; gap: 10px; font-size: clamp(16px, 1.15vw, 20px); line-height: 1.5; }
    .points li::before { content: counter(point); width: 26px; height: 26px; border-radius: 50%; background: var(--soft); color: var(--purple); font-size: 13px; font-weight: 600; display: grid; place-items: center; margin-top: 2px; }
    .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 18px; }
    .chip { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; padding: 7px 12px; border: 1px solid var(--line); border-radius: 18px; background: white; text-decoration: none; }
    .chip.primary { background: var(--purple); border-color: var(--purple); color: white; }
    .chip:hover { border-color: #c9b9d0; }

    .compare { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 32px; }
    .compare section { background: white; border: 1px solid var(--line); border-radius: 12px; padding: 22px; }
    .compare h3 { margin: 0 0 14px; font-size: 22px; }
    .compare p { margin: 16px 0 0; font-size: clamp(16px, 1.15vw, 20px); }

    .pause { background: var(--green); border-radius: 16px; padding: clamp(24px, 3vw, 44px); max-width: 980px; }
    .pause-label { font-size: 14px; color: var(--green-ink); font-weight: 600; }
    .pause ol { margin: 16px 0 0; padding-left: 1.4em; display: grid; gap: 12px; font-size: clamp(18px, 1.5vw, 26px); }
    .pause p { margin: 22px 0 0; color: var(--green-ink); font-size: 15px; }

    .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 24px; max-width: 1100px; }
    .card { background: white; border: 1px solid var(--line); border-radius: 12px; padding: 22px; }
    .card h3 { margin: 0 0 12px; font-size: 22px; }
    .card ul { margin: 0; padding-left: 1.2em; display: grid; gap: 8px; font-size: clamp(16px, 1.1vw, 19px); }

    .table { max-width: 980px; border-top: 1px solid var(--line); }
    .row { display: grid; grid-template-columns: 220px 1fr; gap: 20px; padding: 14px 4px; border-bottom: 1px solid var(--line); font-size: clamp(16px, 1.15vw, 20px); }
    .row span { color: var(--muted); }

    .links { columns: 2 320px; column-gap: 32px; max-width: 1000px; }
    .links a { display: block; break-inside: avoid; padding: 9px 0; border-bottom: 1px solid var(--line); text-decoration: none; font-size: 15px; }
    .links a small { color: var(--muted); margin-left: 6px; }

    .slide-foot { display: flex; align-items: center; gap: 14px; margin-top: 18px; min-height: 32px; flex-wrap: wrap; }
    .tutorial { display: inline-flex; align-items: center; gap: 5px; font-size: 13px; color: #5f5166; text-underline-offset: 3px; }
    .button { border: 1px solid var(--purple); background: var(--purple); color: white; border-radius: 7px; min-height: 38px; padding: 0 14px; font-size: 13px; }
    .button.secondary { background: white; color: var(--purple); border-color: #d9cfdd; }

    .deck { border-top: 1px solid var(--line); min-height: 58px; display: flex; align-items: center; justify-content: space-between; gap: 16px; position: relative; }
    .progress { position: absolute; left: 0; right: 0; top: -1px; height: 2px; }
    .progress span { display: block; height: 100%; background: var(--purple); transition: width .2s; }
    .position { font-size: 13px; color: var(--muted); display: flex; gap: 8px; align-items: baseline; }
    .position strong { font-size: 17px; color: var(--ink); font-variant-numeric: tabular-nums; }
    .hint { font-size: 12px; color: var(--muted); }
    .deck-actions { display: flex; gap: 8px; }

    dialog { border: 0; border-radius: 14px; padding: 0; width: min(760px, calc(100% - 32px)); max-height: calc(100vh - 48px); box-shadow: 0 20px 60px #321b3833; color: var(--ink); }
    dialog::backdrop { background: #2b273055; }
    .sheet-header { display: flex; justify-content: space-between; align-items: center; padding: 18px 22px; border-bottom: 1px solid var(--line); position: sticky; top: 0; background: white; }
    .sheet-header h2 { margin: 0; font-size: 18px; }
    .close-button { border: 0; background: none; font-size: 22px; line-height: 1; width: 36px; height: 36px; border-radius: 6px; color: var(--muted); }
    .sheet-body { padding: 18px 22px 22px; }
    .agenda { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 18px; }
    .agenda h3 { font-size: 13px; color: var(--muted); margin: 0 0 6px; font-weight: 600; }
    .agenda button { display: flex; gap: 10px; width: 100%; text-align: left; border: 0; background: none; padding: 7px 8px; border-radius: 6px; font-size: 14px; color: var(--ink); }
    .agenda button span { color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; min-width: 20px; }
    .agenda button[aria-current="true"] { background: var(--soft); color: var(--purple); font-weight: 600; }
    .migration-steps { margin: 0; padding-left: 1.3em; display: grid; gap: 8px; }
    .migration-steps span { color: var(--muted); margin-left: 6px; font-size: 13px; }
    .migration-actions { display: flex; align-items: center; gap: 14px; margin: 16px 0 10px; flex-wrap: wrap; }
    .migration-actions a { font-size: 13px; }
    .footnote { font-size: 12px; color: var(--muted); margin: 8px 0 0; }
    .migration-prompt { margin-top: 12px; font-size: 13px; }
    .migration-prompt textarea { width: 100%; min-height: 120px; margin: 8px 0; font: inherit; font-size: 13px; padding: 10px; border: 1px solid var(--line); border-radius: 8px; }

    .focus-mode .top-actions .top-link:not(#presentation-mode), .focus-mode .hint { display: none; }
    @media (min-width: 1700px) { :root { --scale: 1.3; } }
    @media (max-width: 900px) {
      .wrap { width: calc(100% - 32px); }
      .body { flex-direction: column; gap: 22px; }
      .body > .text-col { flex: none; min-width: 0; }
      .body > .figure-col { max-width: 100%; }
      .compare { grid-template-columns: minmax(0, 1fr); }
      .row { grid-template-columns: 1fr; gap: 4px; }
      .hint { display: none; }
      .brand-title { display: none; }
    }
    @media (max-width: 480px) {
      .top-link { padding: 0 6px; font-size: 12px; }
      .deck-actions .button { padding: 0 10px; }
    }
  </style>
</head>

  <svg class="icons" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <symbol id="i-external" viewBox="0 0 24 24"><path d="M7 17 17 7M7 7h10v10"/></symbol>
  </svg>
  <div class="wrap">
    <header class="top">
      <div class="brand"><span class="wordmark">glorify</span><span class="brand-title">从飞书到 Slack</span></div>
      <div class="top-actions">
        <button class="top-link" id="agenda-open">目录</button>
        <button class="top-link" id="resources-open">中文资料</button>
        <button class="top-link" id="presentation-mode" aria-pressed="false" title="隐藏辅助按钮，Esc 退出">投屏模式</button>
      </div>
    </header>
    <main class="slide" id="slide" aria-live="polite"></main>
    <noscript>请启用 JavaScript 查看宣讲页面。</noscript>
    <footer class="deck" aria-label="宣讲翻页">
      <div class="progress" aria-hidden="true"><span id="progress"></span></div>
      <div class="position"><strong id="page-number">01</strong><span id="page-total">/ 1</span><span id="page-label"></span></div>
      <span class="hint" id="hint">← → 翻页 · 空格下一页</span>
      <div class="deck-actions"><button class="button secondary" id="previous">← 上一页</button><button class="button" id="next">下一页 →</button></div>
    </footer>
  </div>

  <dialog id="agenda-dialog" aria-labelledby="agenda-title">
    <div class="sheet-header"><h2 id="agenda-title">目录</h2><button class="close-button" data-close="agenda-dialog" aria-label="关闭目录">×</button></div>
    <div class="sheet-body"><div class="agenda" id="agenda"></div></div>
  </dialog>

  <dialog id="migration-dialog" aria-labelledby="migration-title">
    <div class="sheet-header"><h2 id="migration-title">飞书文档 → Google Drive</h2><button class="close-button" data-close="migration-dialog" aria-label="关闭迁移说明">×</button></div>
    <div class="sheet-body">
      <p>把飞书文档转成可编辑的 Google Docs / Sheets / Slides。</p>
      <ol class="migration-steps">
        <li><strong>下载 Skill</strong><span>交给支持本地工具的 AI 助手</span></li>
        <li><strong>确认账号</strong><span>飞书 + 公司 Google 账号</span></li>
        <li><strong>先迁一篇</strong><span>核对内容、格式和共享权限</span></li>
      </ol>
      <div class="migration-actions"><a class="button" href="./skills/lark-to-gdrive/SKILL.md" download="lark-to-gdrive-SKILL.md">下载 Skill</a><a href="https://support.google.com/drive/answer/2424368?hl=zh-Hans" target="_blank" rel="noopener noreferrer">Google 导入文件 · 中文教程 ↗</a></div>
      <p class="footnote">需已登录 lark-cli。飞书原文保留；迁移后重新确认共享。</p>
      <details class="migration-prompt"><summary>给 AI 助手的指令</summary><label class="sr-only" for="migration-prompt">迁移指令</label><textarea id="migration-prompt" readonly>请加载我提供的 lark-to-gdrive Skill，将指定飞书文档迁移为原生 Google Docs / Sheets / Slides，存入我确认的公司 Google Drive 文件夹。
先试迁一篇，核对内容、表格、图片和共享权限后，再处理我确认的清单。保留原文，任何覆盖或删除先确认。
飞书链接：[填写]
目标文件夹：[填写]</textarea><button class="button secondary" id="copy-migration-prompt">复制指令</button><p class="footnote" id="migration-copy-status" role="status" aria-live="polite">授权和迁移由本人在 AI 助手中完成，网页不会读取或上传文件。</p></details>
    </div>
  </dialog>

  <script>
    const sections = {
      prep: { num: '0', title: '会前准备', tag: '提前发给大家做' },
      talk: { num: '1', title: '在哪说话' },
      notice: { num: '2', title: '别漏消息' },
      work: { num: '3', title: '一起干活' },
      demo: { num: '4', title: '现场演示' },
      appendix: { num: '附录', title: '会后查阅' }
    };

    const installLinks = [
      ['Google Calendar', 'https://slack.com/marketplace/ADZ494LHY-google-calendar'],
      ['Google 云端硬盘', 'https://slack.com/marketplace/A6NL8MJ6Q-google-drive'],
      ['Jira Cloud', 'https://slack.com/marketplace/A2RPP3NFR-jira-cloud'],
      ['Google Meet', 'https://slack.com/marketplace/search?q=Google%20Meet']
    ];

    // 截图里的红框用百分比坐标：x、y 是左上角，w、h 是宽高，都相对整张图。
    const slides = [
      {
        id: 'install', section: 'prep', label: '装 Slack 并登录', type: 'shot',
        title: '装好 Slack，用公司 Google 账号登录',
        shot: { missing: 'Slack 登录页（「使用 Google 登录」按钮）', w: 640 },
        points: ['电脑、手机各装一个', '登录时选「使用 Google 登录」', '用 @glorify-app.com 公司邮箱'],
        chips: [['下载 Slack', 'https://slack.com/intl/zh-cn/downloads', true]],
        tutorial: ['下载 Slack · 官方页', 'https://slack.com/intl/zh-cn/downloads']
      },
      {
        id: 'apps', section: 'prep', label: '装常用应用', type: 'shot',
        title: '把常用工具装进 Slack',
        shot: { src: 'assets/app-directory.png', size: [1024, 891], alt: 'Slack 代理与工具里的应用列表', w: 600, box: { x: 2.6, y: 56.8, w: 5.4, h: 9.6 } },
        points: ['左侧「代理与工具」→ 应用', '搜索 Google Calendar、Google 云端硬盘、Jira', '点「添加」；装不了找管理员'],
        chips: installLinks.map(([label, url]) => [`${label} ↗`, url]),
        tutorial: ['添加应用 · 中文教程', 'https://slack.com/intl/zh-cn/help/articles/202035138-添加应用到-Slack-工作区']
      },
      {
        id: 'hours', section: 'prep', label: '标工作时间', type: 'shot',
        title: '在 Google Calendar 标上工作时间',
        shot: { missing: 'Google Calendar → 设置 → 工作时间', w: 640 },
        points: ['设置 → 常规 → 工作时间 → 启用', '按自己所在时区填', '别人约会议时，能看到你几点上下班'],
        tutorial: ['设置工作时间 · 中文教程', 'https://support.google.com/calendar/answer/7638168?hl=zh-Hans']
      },
      {
        id: 'pause-prep', section: 'prep', label: '停一下：都进来了吗', type: 'pause',
        title: '停一下：确认大家都准备好了',
        tasks: ['打开 Slack，左上角是 Glorify', '侧栏能看到频道列表', 'Google Calendar 已标好工作时间'],
        note: '没弄好的举手，旁边同事帮一下。'
      },
      {
        id: 'where', section: 'talk', label: '频道和私信', type: 'shot',
        title: '长期的事发频道，临时的事发私信',
        shot: { src: 'assets/sidebar.png', size: [245, 498], alt: 'Slack 侧栏的频道列表', w: 260, box: { x: 2, y: 54.6, w: 92, h: 44.6 } },
        points: ['频道：按项目或部门开，新人能翻历史', '私信：一对一，或几个人临时聊', '拿不准就发频道'],
        tutorial: ['频道是什么 · 中文教程', 'https://slack.com/intl/zh-cn/help/articles/360017938993']
      },
      {
        id: 'visibility', section: 'talk', label: '公开和私密', type: 'compare',
        title: '# 是公开频道，锁是私密频道',
        sides: [
          { heading: '# 公开频道', shot: { src: 'assets/channel-public.png', size: [245, 75], alt: '侧栏里带 # 的公开频道', w: 360 }, text: '公司里谁都能搜到，自己就能加入。' },
          { heading: '🔒 私密频道', shot: { src: 'assets/channel-private.png', size: [245, 75], alt: '侧栏里带锁的私密频道', w: 360 }, text: '只有成员看得到，要成员拉你进来。' }
        ],
        tutorial: ['频道是什么 · 中文教程', 'https://slack.com/intl/zh-cn/help/articles/360017938993']
      },
      {
        id: 'threads', section: 'talk', label: '话题和消息列', type: 'shot',
        title: '回复进话题，话题都在「消息列」',
        shot: { src: 'assets/threads-view.png', size: [1024, 497], alt: 'Slack 消息列，集中显示参与的话题', w: 860 },
        points: ['在消息上点「回复」，频道不刷屏', '侧栏「消息列」集中看你参与的话题', '重要结论勾选「同时发送到频道」'],
        tutorial: ['话题回复 · 中文教程', 'https://slack.com/intl/zh-cn/help/articles/115000769927']
      },
      {
        id: 'mention', section: 'talk', label: '@ 不在频道的人', type: 'shot',
        title: '@ 了不在频道的人，Slack 会提醒你',
        shot: { src: 'assets/mention-prompt.png', size: [640, 228], alt: 'Slack 提示被提及的人不在私人频道中', w: 820, box: { x: 14.4, y: 69.5, w: 13.6, h: 16 } },
        points: ['点「添加他们」，才会拉进频道', '点「忽略」，对方收不到', '这条提示只有你看得见'],
        tutorial: ['@ 与通知 · 中文教程', 'https://slack.com/intl/zh-cn/help/articles/360002063088']
      },
      {
        id: 'pause-talk', section: 'talk', label: '停一下：发一条', type: 'pause',
        title: '停一下：发一条，回一条',
        tasks: ['在会上指定的测试频道发一句话', '给旁边同事的消息回一条话题', '打开侧栏「消息列」，找到这条话题'],
        note: '大家都回过一条再往下讲。'
      },
      {
        id: 'unread', section: 'notice', label: '加粗和数字', type: 'shot',
        title: '有新消息只加粗，有人 @ 你才有数字',
        shot: { src: 'assets/sidebar.png', size: [245, 498], alt: 'Slack 侧栏里加粗显示的未读频道', w: 260, box: { x: 12, y: 47.8, w: 62, h: 5.6 } },
        points: ['加粗 = 有新消息，不会响', '红色数字 = 有人 @ 你或私信你', '默认只有 @ 和私信会提醒'],
        tutorial: ['通知设置 · 中文教程', 'https://slack.com/intl/zh-cn/help/articles/201355156-配置你的-Slack-通知']
      },
      {
        id: 'alerts', section: 'notice', label: '重要频道开提醒', type: 'shot',

          ['Google Calendar 接入', '在 Slack 看日程和提醒', 'https://slack.com/intl/zh-cn/help/articles/206329808-适用于-Slack-的-Google-日历'],
          ['设置工作时间', 'Google Calendar', 'https://support.google.com/calendar/answer/7638168?hl=zh-Hans'],
          ['Typeless 下载', '语音输入', 'https://www.typeless.com/zh-cn/downloads'],
          ['Typeless 听写', '怎么说、怎么改', 'https://www.typeless.com/zh-cn/help/quickstart/dictate'],
          ['Translate', '应用与权限（英文）', 'https://slack.com/marketplace/A0ZJS6Z7E-translate?tab=more_info']
        ]
      }
    ];

    // 旧网址里的主题名，跳到新页面，避免已分享的链接失效。
    const legacyIds = { entry: 'where', privacy: 'visibility', thread: 'threads', follow: 'unread', habits: 'lark-diff', documents: 'drive', sharing: 'share', video: 'huddle', calendar: 'meeting', translate: 'demo', typeless: 'demo' };

    const slideEl = document.querySelector('#slide');
    let current = 0;

    const escapeText = value => String(value).replace(/[&<>"]/g, char => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[char]));
    const external = (label, url, className) => `<a class="${className}" href="${url}" target="_blank" rel="noopener noreferrer">${escapeText(label)} <svg aria-hidden="true"><use href="#i-external"/></svg></a>`;

    function shotHtml(shot) {
      if (shot.missing) return `<div class="shot-missing" style="--w:${shot.w}px"><strong>待补截图</strong><span>${escapeText(shot.missing)}</span></div>`;
      const box = shot.box ? `<span class="box" style="left:${shot.box.x}%;top:${shot.box.y}%;width:${shot.box.w}%;height:${shot.box.h}%"></span>` : '';
      return `<figure class="shot" style="--w:${shot.w}px;--r:${shot.size[0] / shot.size[1]}"><img src="${shot.src}" alt="${escapeText(shot.alt)}">${box}</figure>`;
    }

    function bodyHtml(slide) {
      if (slide.type === 'shot') {
        const points = `<ol class="points">${slide.points.map(point => `<li>${escapeText(point)}</li>`).join('')}</ol>`;
        const chips = slide.chips ? `<div class="chips">${slide.chips.map(([label, url, primary]) => `<a class="chip ${primary ? 'primary' : ''}" href="${url}" target="_blank" rel="noopener noreferrer">${escapeText(label)}</a>`).join('')}</div>` : '';
        return `<div class="body"><div class="figure-col">${shotHtml(slide.shot)}</div><div class="text-col">${points}${chips}</div></div>`;
      }
      if (slide.type === 'compare') {
        return `<div class="body full"><div class="compare">${slide.sides.map(side => `<section><h3>${escapeText(side.heading)}</h3>${shotHtml(side.shot)}<p>${escapeText(side.text)}</p></section>`).join('')}</div></div>`;
      }
      if (slide.type === 'pause') {
        return `<div class="body full"><div class="pause"><div class="pause-label">现在请大家动手</div><ol>${slide.tasks.map(task => `<li>${escapeText(task)}</li>`).join('')}</ol><p>${escapeText(slide.note)}</p></div></div>`;
      }
      if (slide.type === 'cards') {
        return `<div class="body full"><div class="cards">${slide.cards.map(card => `<section class="card"><h3>${escapeText(card.heading)}</h3><ul>${card.items.map(item => `<li>${escapeText(item)}</li>`).join('')}</ul><div class="slide-foot">${external(card.link[0], card.link[1], 'tutorial')}</div></section>`).join('')}</div></div>`;
      }
      if (slide.type === 'table') {
        return `<div class="body full"><div class="table">${slide.rows.map(([lark, slack]) => `<div class="row"><span>飞书：${escapeText(lark)}</span><strong>${escapeText(slack)}</strong></div>`).join('')}</div></div>`;
      }
      return `<div class="body full"><div class="links">${slide.links.map(([label, note, url]) => `<a href="${url}" target="_blank" rel="noopener noreferrer">${escapeText(label)}<small>${escapeText(note)} ↗</small></a>`).join('')}</div></div>`;
    }

    function render() {
      const slide = slides[current];
      const section = sections[slide.section];
      const sectionSlides = slides.filter(item => item.section === slide.section);
      const tag = section.tag ? `<span class="tag">${section.tag}</span>` : '';
      const tutorial = slide.tutorial ? external(slide.tutorial[0], slide.tutorial[1], 'tutorial') : '';
      const migration = slide.migration ? '<button class="button secondary" data-open-migration>搬飞书旧文档</button>' : '';
      slideEl.innerHTML = `<div class="kicker"><strong>${section.num} ${section.title}</strong><span>${sectionSlides.indexOf(slide) + 1} / ${sectionSlides.length}</span>${tag}</div><h2>${escapeText(slide.title)}</h2>${bodyHtml(slide)}<div class="slide-foot">${tutorial}${migration}</div>`;
      document.querySelector('#page-number').textContent = String(current + 1).padStart(2, '0');
      document.querySelector('#page-total').textContent = `/ ${slides.length}`;
      document.querySelector('#page-label').textContent = slide.label;
      document.querySelector('#progress').style.width = `${(current + 1) / slides.length * 100}%`;
      document.querySelector('#previous').disabled = current === 0;
      document.querySelector('#next').disabled = current === slides.length - 1;
      document.querySelectorAll('#agenda button').forEach(button => button.setAttribute('aria-current', String(button.dataset.slide === slide.id)));
    }

    function go(index) {
      if (index < 0 || index >= slides.length) return;
      current = index;
      history.replaceState(null, '', `#${slides[current].id}`);
      render();
      document.querySelector('#agenda-dialog').close();
      window.scrollTo({ top: 0 });
    }

    function goToId(id) {
      const index = slides.findIndex(slide => slide.id === (legacyIds[id] || id));
      if (index >= 0) go(index);
    }

    document.querySelector('#agenda').innerHTML = Object.entries(sections).map(([key, section]) => `<section><h3>${section.num} ${section.title}</h3>${slides.map((slide, index) => slide.section === key ? `<button data-slide="${slide.id}"><span>${String(index + 1).padStart(2, '0')}</span>${escapeText(slide.label)}</button>` : '').join('')}</section>`).join('');
    document.querySelector('#agenda').addEventListener('click', event => {
      const button = event.target.closest('[data-slide]');
      if (button) goToId(button.dataset.slide);
    });
    slideEl.addEventListener('click', event => {
      if (event.target.closest('[data-open-migration]')) document.querySelector('#migration-dialog').showModal();
    });
    document.querySelector('#previous').addEventListener('click', () => go(current - 1));
    document.querySelector('#next').addEventListener('click', () => go(current + 1));
    document.querySelector('#agenda-open').addEventListener('click', () => document.querySelector('#agenda-dialog').showModal());
    document.querySelector('#resources-open').addEventListener('click', () => goToId('resources'));
    document.querySelector('#copy-migration-prompt').addEventListener('click', () => {
      const prompt = document.querySelector('#migration-prompt');
      const status = document.querySelector('#migration-copy-status');
      prompt.focus();
      prompt.select();
      status.textContent = '已选中，可按 ⌘C / Ctrl+C 复制。';
      if (navigator.clipboard) navigator.clipboard.writeText(prompt.value).then(() => { status.textContent = '已复制，粘贴到 AI 助手即可。'; }, () => {});
    });
    document.querySelectorAll('[data-close]').forEach(button => button.addEventListener('click', () => document.getElementById(button.dataset.close).close()));
    document.querySelectorAll('dialog').forEach(dialog => dialog.addEventListener('click', event => {
      if (event.target === dialog) dialog.close();
    }));

    function setPresentationMode(enabled) {
      document.body.classList.toggle('focus-mode', enabled);
      const button = document.querySelector('#presentation-mode');
      button.textContent = enabled ? '退出投屏' : '投屏模式';
      button.setAttribute('aria-pressed', String(enabled));
    }
    document.querySelector('#presentation-mode').addEventListener('click', () => setPresentationMode(!document.body.classList.contains('focus-mode')));
    document.addEventListener('keydown', event => {
      if (event.altKey || event.ctrlKey || event.metaKey || document.querySelector('dialog[open]')) return;
      if (event.key === 'Escape' && document.body.classList.contains('focus-mode')) { setPresentationMode(false); return; }
      if (event.target.closest('input, textarea, select')) return;
      if (event.key === 'ArrowRight' || event.key === 'PageDown') { event.preventDefault(); go(current + 1); }
      if (event.key === 'ArrowLeft' || event.key === 'PageUp') { event.preventDefault(); go(current - 1); }
      if (event.key === ' ' && !event.target.closest('button, a, summary')) { event.preventDefault(); go(current + 1); }
      if (event.key === 'Home') { event.preventDefault(); go(0); }
      if (event.key === 'End') { event.preventDefault(); go(slides.length - 1); }
    });
    window.addEventListener('hashchange', () => goToId(location.hash.slice(1)));

    const initialId = location.hash.slice(1);
    if (initialId && slides.some(slide => slide.id === (legacyIds[initialId] || initialId))) goToId(initialId);
    else render();
  </script>
